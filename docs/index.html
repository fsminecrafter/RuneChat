<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101513">
  <meta name="description" content="RuneChat, a small browser-local chat demo.">
  <title>RuneChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8eee9;
      --muted: #8e9b91;
      --line: #29332d;
      --base: #101513;
      --panel: #171e1a;
      --raised: #202923;
      --green: #9be0a4;
      --green-dark: #233d2c;
      --gold: #e4c47d;
      --coral: #e58b78;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; height: 100vh; overflow: hidden; background: var(--base); color: var(--ink); font-family: "DM Sans", sans-serif; }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { display: flex; height: 100%; max-width: 1600px; margin: auto; border-inline: 1px solid #202923; }
    .sidebar { width: 330px; flex: 0 0 330px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
    .side-head { padding: 24px 20px 16px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px 10px 10px 3px; background: var(--green); color: #142018; font-size: 19px; font-weight: 700; }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0; }
    .brand-name span { color: var(--green); }
    .local-tag { margin-left: auto; border: 1px solid #6d5932; border-radius: 4px; padding: 4px 6px; color: var(--gold); font: 10px "DM Mono", monospace; letter-spacing: 0; }
    .side-tools { display: flex; gap: 8px; padding: 0 16px 14px; }
    .search { width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); outline: none; background: var(--base); color: var(--ink); font-size: 13px; }
    .search:focus, .composer input:focus { border-color: var(--green); }
    .search::placeholder, .composer input::placeholder { color: #718076; }
    .new-chat { flex: 0 0 38px; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--raised); color: var(--green); cursor: pointer; font-size: 20px; }
    .new-chat:hover, .quiet-btn:hover { background: #2a362e; }
    .list-label { padding: 3px 20px 8px; color: var(--muted); font: 10px "DM Mono", monospace; letter-spacing: 1px; text-transform: uppercase; }
    .chat-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
    .chat-row { width: 100%; display: flex; gap: 11px; align-items: center; padding: 11px 10px; border: 0; border-radius: var(--radius); background: transparent; text-align: left; cursor: pointer; }
    .chat-row:hover { background: #202923; }
    .chat-row.selected { background: #26342a; }
    .avatar { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border: 1px solid #48564b; border-radius: 50%; background: #303d33; color: var(--green); font-size: 15px; font-weight: 600; }
    .avatar.gold { color: var(--gold); background: #3a3425; border-color: #5a4d33; }
    .avatar.coral { color: var(--coral); background: #3c2b28; border-color: #5e3e38; }
    .chat-meta { flex: 1; min-width: 0; }
    .chat-line { display: flex; justify-content: space-between; gap: 8px; }
    .chat-name { overflow: hidden; color: var(--ink); font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .chat-time { flex: 0 0 auto; color: var(--muted); font: 10px "DM Mono", monospace; }
    .chat-preview { overflow: hidden; margin-top: 4px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .side-foot { padding: 14px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.55; }
    .side-foot a { color: var(--green); text-decoration: none; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(ellipse at 70% 8%, #1b2a20 0, transparent 37%), var(--base); }
    .chat-head { display: flex; align-items: center; gap: 12px; min-height: 74px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: #131a16dd; }
    .chat-title { min-width: 0; }
    .chat-title h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .chat-title p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .head-note { margin-left: auto; color: var(--muted); font: 10px "DM Mono", monospace; }
    .messages { flex: 1; overflow-y: auto; padding: 24px clamp(18px, 5vw, 72px); }
    .day-label { display: flex; align-items: center; gap: 12px; margin: 4px 0 24px; color: var(--muted); font: 10px "DM Mono", monospace; text-transform: uppercase; }
    .day-label::before, .day-label::after { height: 1px; flex: 1; background: var(--line); content: ""; }
    .message { width: fit-content; max-width: min(72%, 520px); margin: 0 0 9px; padding: 10px 13px 8px; border: 1px solid var(--line); border-radius: 12px 12px 12px 3px; background: var(--panel); color: var(--ink); font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.mine { margin-left: auto; border-color: #36553d; border-radius: 12px 12px 3px 12px; background: var(--green-dark); }
    .message time { display: block; margin-top: 4px; color: #a4b1a6; font: 9px "DM Mono", monospace; text-align: right; }
    .empty { display: grid; height: 100%; place-content: center; justify-items: center; color: var(--muted); text-align: center; }
    .empty-mark { display: grid; width: 54px; height: 54px; margin-bottom: 12px; place-items: center; border: 1px solid var(--line); border-radius: 18px 18px 18px 5px; background: var(--panel); color: var(--green); font-size: 24px; }
    .empty p { margin: 0; font-size: 13px; }
    .compose-area { padding: 12px 24px 20px; }
    .composer { display: flex; gap: 9px; max-width: 920px; margin: auto; }
    .composer input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); outline: none; background: #18201b; color: var(--ink); font-size: 13px; }
    .send { padding: 0 17px; border: 0; border-radius: var(--radius); background: var(--green); color: #142018; font-size: 12px; font-weight: 700; cursor: pointer; }
    .send:hover { background: #b4edbb; }
    .mobile-back { display: none; }
    @media (max-width: 680px) {
      .app { border: 0; }
      .sidebar { display: none; width: 100%; flex-basis: 100%; border: 0; }
      .app.sidebar-open .sidebar { display: flex; }
      .app.sidebar-open .main { display: none; }
      .chat-head { min-height: 64px; padding: 10px 14px; }
      .mobile-back { display: block; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--green); cursor: pointer; }
      .messages { padding: 18px 14px; }
      .message { max-width: 86%; }
      .compose-area { padding: 10px 12px 14px; }
      .head-note { display: none; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Conversations">
      <header class="side-head">
        <div class="brand"><div class="brand-mark" aria-hidden="true">R</div><div class="brand-name">Rune<span>Chat</span></div><div class="local-tag">LOCAL DEMO</div></div>
      </header>
      <div class="side-tools">
        <input class="search" id="search" type="search" placeholder="Find a conversation" aria-label="Find a conversation">
        <button class="new-chat" id="newChat" type="button" title="Start a conversation" aria-label="Start a conversation">+</button>
      </div>
      <div class="list-label">Messages</div>
      <nav class="chat-list" id="chatList" aria-label="Message list"></nav>
      <footer class="side-foot">This demo saves messages in this browser only. <a href="https://github.com/fsminecrafter/RuneChat">View the project</a></footer>
    </aside>
    <main class="main">
      <header class="chat-head">
        <button class="mobile-back" id="mobileBack" type="button" aria-label="Back to conversations">&#8592;</button>
        <div class="avatar" id="activeAvatar" aria-hidden="true"></div>
        <div class="chat-title"><h1 id="activeName">RuneChat</h1><p id="activeStatus">A quiet place to talk</p></div>
        <div class="head-note">SAVED ON THIS DEVICE</div>
      </header>
      <section class="messages" id="messages" aria-live="polite" aria-label="Messages"></section>
      <div class="compose-area">
        <form class="composer" id="composer">
          <input id="messageInput" autocomplete="off" maxlength="2000" placeholder="Write a message" aria-label="Write a message">
          <button class="send" type="submit">Send</button>
        </form>
      </div>
    </main>
  </div>
  <script>
    const storageKey = "runechat.pages.conversations.v1";
    const starterConversations = [
      { id: "mira", name: "Mira Chen", color: "green", messages: [{ text: "The first frost came early this year.", time: "09:14", mine: false }, { text: "A good excuse to stay in and make tea.", time: "09:16", mine: true }] },
      { id: "rowan", name: "Rowan Vale", color: "gold", messages: [{ text: "Found a new trail by the river. It is quiet in the morning.", time: "Yesterday", mine: false }] },
      { id: "sana", name: "Sana Okafor", color: "coral", messages: [{ text: "Sending you the playlist we talked about.", time: "Tue", mine: false }, { text: "Perfect, thank you!", time: "Tue", mine: true }] }
    ];
    const app = document.getElementById("app");
    const chatList = document.getElementById("chatList");
    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const search = document.getElementById("search");
    let conversations = loadConversations();
    let activeId = conversations[0]?.id || null;

    function loadConversations() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(saved)) return saved;
      } catch (error) {
        console.warn("RuneChat could not read saved conversations.", error);
      }
      return structuredClone(starterConversations);
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(conversations));
      } catch (error) {
        window.alert("This browser could not save the conversation. Check its storage settings.");
      }
    }

    function initials(name) {
      return name.trim().split(/\s+/).slice(0, 2).map((part) => part[0]).join("").toUpperCase();
    }

    function latestMessage(conversation) {
      return conversation.messages[conversation.messages.length - 1];
    }

    function renderList() {
      const query = search.value.trim().toLowerCase();
      chatList.replaceChildren();
      conversations
        .filter((conversation) => conversation.name.toLowerCase().includes(query) || latestMessage(conversation)?.text.toLowerCase().includes(query))
        .forEach((conversation) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = `chat-row${conversation.id === activeId ? " selected" : ""}`;
          row.setAttribute("aria-current", conversation.id === activeId ? "true" : "false");
          const avatar = document.createElement("span");
          avatar.className = `avatar ${conversation.color || "green"}`;
          avatar.textContent = initials(conversation.name);
          const meta = document.createElement("span");
          meta.className = "chat-meta";
          const line = document.createElement("span");
          line.className = "chat-line";
          const name = document.createElement("span");
          name.className = "chat-name";
          name.textContent = conversation.name;
          const time = document.createElement("time");
          time.className = "chat-time";
          time.textContent = latestMessage(conversation)?.time || "";
          const preview = document.createElement("span");
          preview.className = "chat-preview";
          preview.textContent = latestMessage(conversation)?.text || "Start a conversation";
          line.append(name, time);
          meta.append(line, preview);
          row.append(avatar, meta);
          row.addEventListener("click", () => selectConversation(conversation.id));
          chatList.append(row);
        });
    }

    function renderMessages() {
      const conversation = conversations.find((item) => item.id === activeId);
      messages.replaceChildren();
      if (!conversation) {
        document.getElementById("activeAvatar").textContent = "R";
        document.getElementById("activeName").textContent = "RuneChat";
        document.getElementById("activeStatus").textContent = "Start a conversation to say hello";
        const empty = document.createElement("div");
        empty.className = "empty";
        const mark = document.createElement("div");
        mark.className = "empty-mark";
        mark.textContent = "R";
        const copy = document.createElement("p");
        copy.textContent = "Your conversations will appear here.";
        empty.append(mark, copy);
        messages.append(empty);
        return;
      }
      const activeAvatar = document.getElementById("activeAvatar");
      activeAvatar.className = `avatar ${conversation.color || "green"}`;
      activeAvatar.textContent = initials(conversation.name);
      document.getElementById("activeName").textContent = conversation.name;
      document.getElementById("activeStatus").textContent = "Private to this browser";
      const day = document.createElement("div");
      day.className = "day-label";
      day.textContent = "Conversation";
      messages.append(day);
      conversation.messages.forEach((item) => {
        const bubble = document.createElement("article");
        bubble.className = `message${item.mine ? " mine" : ""}`;
        bubble.append(document.createTextNode(item.text));
        const time = document.createElement("time");
        time.textContent = item.time;
        bubble.append(time);
        messages.append(bubble);
      });
      messages.scrollTop = messages.scrollHeight;
    }

    function selectConversation(id) {
      activeId = id;
      renderList();
      renderMessages();
      app.classList.remove("sidebar-open");
      input.focus();
    }

    function currentTime() {
      return new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" }).format(new Date());
    }

    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      let conversation = conversations.find((item) => item.id === activeId);
      if (!conversation) {
        conversation = { id: crypto.randomUUID(), name: "My notes", color: "green", messages: [] };
        conversations.unshift(conversation);
        activeId = conversation.id;
      }
      conversation.messages.push({ text, time: currentTime(), mine: true });
      input.value = "";
      save();
      renderList();
      renderMessages();
    });

    document.getElementById("newChat").addEventListener("click", () => {
      const name = window.prompt("Conversation name");
      if (!name?.trim()) return;
      const conversation = { id: crypto.randomUUID(), name: name.trim().slice(0, 60), color: "green", messages: [] };
      conversations.unshift(conversation);
      save();
      selectConversation(conversation.id);
    });

    document.getElementById("mobileBack").addEventListener("click", () => app.classList.add("sidebar-open"));
    search.addEventListener("input", renderList);
    renderList();
    renderMessages();
  </script>
</body>
</html>
